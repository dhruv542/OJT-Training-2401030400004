<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&" />
        <link rel="stylesheet" href="style1.css">
    </head>

    <body>
        <div class="container">
            <div class="head">
                <div class="nav">
                    <strong class="menu">MakerBazar.in</strong>
                    <a class="menu1" href="order.html">
                        <p>Orders</p>
                    </a>
                    <a class="menu1" href="profile.html">
                        <p>Profile</p>
                    </a>
                </div>
                <div class="p-icon">
                    <div class="i-logo">
                        <button class="D">D</button>
                    </div>
                </div>
            </div>

            <div class="order">
                <strong class="menu">
                    Profile
                </strong>
            </div>

            <div class="email">
                <div class="det">
                    <div class="pen">
                        <p style="font-weight: normal;">dhruv panchal</p>
                        <span class="material-symbols-outlined" class="pen-i" style="width: 2px;">edit</span>

                    </div>
                    <br>
                    <p style="font-size: 12px; color: #868585; line-height: 2;">Email</p>
                    <p style="font-size: 14px;">dp069753@gmail.com</p>
                </div>

                <div class="address">

                    <div class="para">
                        <p>Addresses</p>
                        <button type="button" id="addAddressButton">+ Add</button>
                    </div>

                    <div class="noadd">
                        <span class="info-icon">i</span>
                        <p>No addresses added</p>
                    </div>
                </div>
            </div>
            <div class="so">

                <button>
                    Sign out
                </button>

                <a href="">
                    <p>Sign out of all device</p>
                </a>
            </div>
            <div class="modal-overlay hidden" id="modalOverlay"></div>
            <div class="modal hidden" id="adressmodal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
                <div class="modal-content">
                    <button class="close-modal" id="closeModal" aria-label="Close modal">&times;</button>
                    <h3 id="modalTitle">Add address</h3>
                    <form class="row g-3 popup-form">
                        <div class="col-12">
                            <label for="country" class="form-label">Country/region</label>
                            <select id="country" class="form-select">
                                <option selected>India</option>
                                <option>United States</option>
                                <option>United Kingdom</option>
                                <option>Australia</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="firstName" class="form-label">First name</label>
                            <input type="text" class="form-control" id="firstName" placeholder="First name">
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Last name</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Last name">
                        </div>
                        <div class="col-12">
                            <label for="company" class="form-label">Company</label>
                            <input type="text" class="form-control" id="company" placeholder="Company">
                        </div>
                        <div class="col-12">
                            <label for="addressLine1" class="form-label">Address</label>
                            <input type="text" class="form-control" id="addressLine1" placeholder="Street address">
                        </div>
                        <div class="col-12">
                            <label for="addressLine2" class="form-label">Apartment, suite, etc (optional)</label>
                            <input type="text" class="form-control" id="addressLine2" placeholder="Apartment, suite, etc">
                        </div>
                        <div class="col-md-4">
                            <label for="city" class="form-label">City</label>
                            <input type="text" class="form-control" id="city" placeholder="City">
                        </div>
                        <div class="col-md-4">
                            <label for="state" class="form-label">State</label>
                            <select id="state" class="form-select">
                                <option selected>Andaman and Nicob...</option>
                                <option>Maharashtra</option>
                                <option>Delhi</option>
                                <option>Karnataka</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="pin" class="form-label">PIN code</label>
                            <input type="text" class="form-control" id="pin" placeholder="PIN code">
                        </div>
                        <div class="col-12">
                            <label for="phone" class="form-label">Phone</label>
                            <div class="input-group">
                                <span class="input-group-text">+91</span>
                                <input type="tel" class="form-control" id="phone" placeholder="Phone">
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="defaultAddress">
                                <label class="form-check-label" for="defaultAddress">This is my default address</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary w-100">Save address</button>
                        </div>
                    </form>
                </div>
            </div>
            
        </div>
        <script src="script.js"></script>
    </body>

</html>
